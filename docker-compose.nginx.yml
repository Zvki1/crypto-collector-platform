# ===================================================
# docker-compose.nginx.yml
# Version AVEC Nginx comme reverse proxy
#
# Utilisation:
# docker-compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
# ===================================================

services:
  # Override du frontend pour utiliser Nginx au lieu de Vite dev server
  frontend:
    build:
      context: ./Cryptocollectorfront
      dockerfile: Dockerfile
      target: production
    ports:
      - '80:80'
    volumes: []
    command: null
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost/health',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optionnel: Nginx comme reverse proxy global
  nginx:
    image: nginx:alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - crypto_network
    depends_on:
      - api
      - frontend
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost/health',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
