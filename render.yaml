databases:
  - name: crypto-postgres
    databaseName: crypto_platform
    user: crypto_user
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all

services:
  - type: redis
    name: crypto-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all

  # Collector Service
  - type: web
    name: crypto-collector
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx nest build collector
    startCommand: npx prisma migrate deploy && node dist/apps/collector/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: crypto-redis
          property: connectionString
      - key: COINGECKO_API_URL
        value: https://api.coingecko.com/api/v3
      - key: COINGECKO_RATE_LIMIT_MS
        value: 2000
      - key: COLLECTOR_CRYPTO_IDS
        value: bitcoin,ethereum,solana
      - key: COLLECTOR_INTERVAL_MINUTES
        value: 5
    healthCheckPath: /health/simple
