

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_password_dev
      POSTGRES_DB: crypto_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto_network

  # Redis (Bull Queue)
  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto_network

  # PgAdmin db visualization
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    # restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: rzaki@hotmail.fr
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - crypto_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:

networks:
  crypto_network:
    driver: bridge