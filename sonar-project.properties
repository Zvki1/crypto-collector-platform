# SonarCloud Configuration
sonar.projectKey=Zvki1_crypto-collector-platform
sonar.organization=zvki1

# Project Information
sonar.projectName=Crypto Collector Platform
sonar.projectVersion=1.0

# Source Code
sonar.sources=apps,libs
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test/**,**/*.e2e-spec.ts

# Test Configuration
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

# Coverage Report Path
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts
